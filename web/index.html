<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- SEO Meta Tags -->
  <title>Ashwin R — Software Developer Portfolio</title>
  <meta name="description" content="Ashwin R is an emerging software developer specializing in full-stack development, UI/UX design, and cloud computing. Explore projects like Summarizit and Task_Flow.">
  <meta name="keywords" content="Ashwin R, software developer, Flutter, React, Node.js, portfolio, full-stack developer, UI/UX">
  <meta name="author" content="Ashwin R">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:title" content="Ashwin R — Software Developer Portfolio">
  <meta property="og:description" content="Emerging software developer building full-stack applications with Flutter, React, Node.js, and cloud technologies.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ashwinr.dev">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ashwin R — Software Developer Portfolio">
  <meta name="twitter:description" content="Emerging software developer building full-stack applications with Flutter, React, Node.js, and cloud technologies.">

  <!-- Theme Color (matches the dark background) -->
  <meta name="theme-color" content="#0A0E1A">
  <meta name="msapplication-navbutton-color" content="#0A0E1A">
  <meta name="apple-mobile-web-app-status-bar-style" content="#0A0E1A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ashwin R">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect to Google Fonts for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen styling — matches the dark background so the
       transition into the Flutter app is seamless */
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E1A;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
